$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

animations { enabled = false }

background {
    path = screenshot
    blur_passes = 3
}

input-field {
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0)

    outer_color = rgb(99cc99)
    check_color = rgb(99cc99)
    fail_color = rgb(f2777a)
    bothlock_color = rgb(f2777a)

    font_color = rgb(d3d0c8)
    fade_on_empty = false
    rounding = 2

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    check_text = Authenticating...

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

label {
    text = $TIME
    font_size = 90
    color = rgb(66cccc)
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

label {
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    color = rgb(cc99cc)
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

label {
    text = $LAYOUT[en]
    font_size = 24
    color = rgb(ffcc66)
    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}
